# ========================================
# Hillside View 46-key split keyboard configuration
# Board: nice_nano (HWMv2)
# Features: nice_view display, Cirque trackpad, encoder
# Uses mainline ZMK with native pointing device support
# =========================================
#
# NOTE: This file is loaded for both central and peripheral sides.
# Central-only options should go in hillside_view_left*.conf files.

# Bluetooth - max power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Pointing device support - mainline ZMK (replaces CONFIG_ZMK_MOUSE)
CONFIG_ZMK_POINTING=y
