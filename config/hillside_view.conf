# ========================================
# FileName: hillside_view.conf
# Hillside View 46-key split keyboard configuration
# Board: nice_nano_v2
# Features: nice_view display, 2 encoders, RGB underglow
# Copyright (c) 2022 The ZMK Contributors
# SPDX-License-Identifier: MIT
# =========================================

### Boost Bluetooth TX power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

### Disable Bluetooth pairing passkey requirement
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

### POWER OPTIONS
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_EXT_POWER=y
# 30 min (30*60*1000ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

### ZMK STUDIO
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

### NICE!VIEW DISPLAY (zmk-nice-oled module)
# Enable nice!view e-paper display with custom widgets
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Display buffer size
CONFIG_LV_Z_VDB_SIZE=64

### zmk-nice-oled widget configuration (ZMK v0.3.0)
# WPM widget with Luna animation (central only)
# Note: Disable bongo cat to avoid linker conflict with Luna
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n

# HID indicators (caps lock, etc.)
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_LUNA=n
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_BONGO_CAT=n

# Modifier display (shows active Ctrl, Shift, Alt, Gui)
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=y

# Peripheral animation (right side)
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y

### Encoder support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

### Debouncing - low latency
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

### Improves compatibility with iPad
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y
