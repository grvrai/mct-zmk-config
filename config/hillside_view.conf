# ========================================
# Hillside View 46-key split keyboard configuration
# Board: nice_nano_v2
# Features: nice_view display, Cirque trackpad, encoder
# Uses badjeff's ZMK fork with pointer support
# =========================================

# Keyboard name
CONFIG_ZMK_KEYBOARD_NAME="HillsideView"

# Display
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY=y

# Encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Bluetooth - max power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Battery - fetch peripheral battery to display on central
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Mouse/Trackpad
CONFIG_ZMK_MOUSE=y
