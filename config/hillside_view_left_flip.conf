# ========================================
# Hillside View LEFT FLIP (central)
# Features: nice!view display, MCU on top
# MAINLINE ZMK with ZMK Studio support
# =========================================

CONFIG_ZMK_KEYBOARD_NAME="HSV Left"

# Bluetooth - max power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Fetch peripheral battery over BLE (for display on central)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Pointing device support - receives Cirque input from peripheral via input-split
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
