# Hillside View Cirque - Mainline ZMK
# Using official ZMK with native Cirque/pointing support
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob
    - name: mctechnology17
      url-base: https://github.com/mctechnology17
  projects:
    # ZMK core - pinned to v0.3.0 for zmk-nice-oled compatibility
    # v0.3.0 includes pointing/Cirque support
    - name: zmk
      remote: zmkfirmware
      revision: v0.3.0
      import: app/west.yml

    # Helper macros
    - name: zmk-helpers
      remote: urob
      revision: main

    # Custom nice!view widgets with peripheral battery display
    - name: zmk-nice-oled
      remote: mctechnology17
      revision: main
  self:
    path: config
