manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob
    - name: mctechnology17
      url-base: https://github.com/mctechnology17
  projects:
    # Mainline ZMK with native pointing device support (Zephyr 4.1+)
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # Helper macros
    - name: zmk-helpers
      remote: urob
      revision: main
    # Nice OLED widgets (for peripheral battery display)
    - name: zmk-nice-oled
      remote: mctechnology17
      revision: main
  self:
    path: config
