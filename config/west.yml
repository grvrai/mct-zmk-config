manifest:
  defaults:
    revision: v0.1
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # dongle_display
    - name: englmaxi
      url-base: https://github.com/englmaxi
    # nice_oled - nice_epaper - dongle_display!view - oled Adapter
    - name: mctechnology17
      url-base: https://github.com/mctechnology17
    # urob - zmk-helpers and zmk-auto-layer
    - name: urob
      url-base: https://github.com/urob
    # caksoylar - zmk-rgbled-widget for onboard LED indicators
    - name: caksoylar
      url-base: https://github.com/caksoylar
    # badjeff - cirque-input-module and split-peripheral-input-relay
    - name: badjeff
      url-base: https://github.com/badjeff
    # dnlbauer - Corax56 keyboard shield
    - name: dnlbauer
      url-base: https://github.com/dnlbauer
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3.0
      import: app/west.yml
    # dongle_display (v0.3 branch for ZMK v0.3.0 compatibility)
    - name: zmk-dongle-display
      remote: englmaxi
      revision: v0.3
    # nice_oled - nice_epaper - nice_custom (main for latest features)
    - name: zmk-nice-oled
      remote: mctechnology17
      revision: main
    # dongle_display!view
    - name: zmk-dongle-display-view
      remote: mctechnology17
      revision: main
    # oled Adapter
    - name: zmk-oled-adapter
      remote: mctechnology17
      revision: main
    # zmk-helpers - convenience macros
    - name: zmk-helpers
      remote: urob
      revision: main
    # zmk-auto-layer - numword behavior (klor.keymap uses &num_word)
    - name: zmk-auto-layer
      remote: urob
      revision: v0.3.0
    # zmk-tri-state - tri-state behavior for app switcher
    - name: zmk-tri-state
      remote: urob
    # zmk-rgbled-widget - onboard LED power/battery/status indicator
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: main
    # cirque-input-module - Cirque Pinnacle trackpad driver
    - name: cirque-input-module
      remote: badjeff
      revision: main
    # zmk-split-peripheral-input-relay - relay input from peripheral to central
    - name: zmk-split-peripheral-input-relay
      remote: badjeff
      revision: main
    # zmk-keyboards-corax - Corax56 keyboard shield definitions
    - name: zmk-keyboards-corax
      remote: dnlbauer
      revision: main
  self:
    path: config
