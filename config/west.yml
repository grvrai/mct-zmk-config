# Hillside View Cirque - Mainline ZMK
# Using official ZMK with native Cirque/pointing support
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob
  projects:
    # ZMK core - official mainline with native pointing support
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml

    # Helper macros
    - name: zmk-helpers
      remote: urob
      revision: main
  self:
    path: config
