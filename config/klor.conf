### Boost Bluetooth TX power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

### Disable Bluetooth pairing passkey requirement
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

### POWER OPTIONS
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_EXT_POWER=y
# Lowered to 5 min while debugging the "left side not sleeping" issue.
# Restore to 900000 (15 min) once confirmed working.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000
# Display blanks 30s after going idle (default, made explicit)
CONFIG_ZMK_IDLE_TIMEOUT=30000
# Make sure no debug logging keeps the chip awake
CONFIG_ZMK_USB_LOGGING=n

### ZMK STUDIO
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

### OLED DISPLAY
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_SSD1306=y
CONFIG_I2C=y
CONFIG_LV_Z_VDB_SIZE=64
CONFIG_LV_DPI_DEF=148

### BATTERY - enable battery reporting for local battery display
CONFIG_ZMK_BATTERY_REPORTING=y

### DONGLE DISPLAY - show both central and peripheral battery
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y
# Use Mac modifier icons (Cmd, Opt instead of Win, Alt)
CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y
# Show WPM meter
CONFIG_ZMK_DONGLE_DISPLAY_WPM=y
# Disable Bongo Cat — its infinite LV animation rewrites the framebuffer every
# frame, which immediately wakes the SSD1306 back up after ZMK blanks it.
# Killing Bongo lets ZMK_DISPLAY_BLANK_ON_IDLE actually take effect.
CONFIG_ZMK_DONGLE_DISPLAY_BONGO_CAT=n

### NICE_OLED SLEEP ART
# Dormant while right shield = dongle_display. If you ever flip back to
# nice_oled (in build.yaml), uncomment these to enable sleep art:
# CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_IDLE=y
# CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_SLEEP=y
#
# Note: nice_oled's sleep_status.c also gates the actual art visibility on
# CONFIG_NICE_PERI_VIEW_SHOW_SLEEP_ART_ON_{IDLE,SLEEP}, but that symbol is
# never declared in Kconfig and Zephyr aborts on unknown symbols. To force
# it on you'd need to patch sleep_status.c (or pass it via cmake_args with
# DTS-style override). For now: the widget compiles when the OLED configs
# above are set, but the art will stay hidden — known module limitation.

### Encoder support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

### Debouncing - low latency
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

### Improves compatibility with iPad
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y
