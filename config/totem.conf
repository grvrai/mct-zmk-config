# Totem Keyboard Configuration
# 38-key split keyboard with wireless controllers

# ============================================================================
# Display Configuration (Optional - if using OLED/ePaper displays)
# ============================================================================

# Enable display support
# CONFIG_ZMK_DISPLAY=y

# Display buffer size (adjust for different display types)
# CONFIG_LV_Z_VDB_SIZE=64

# Display DPI (brightness control for ePaper, 100-200 range)
# CONFIG_LV_DPI=148

# Disable OLED gem animation for static displays
# CONFIG_NICE_OLED_GEM_ANIMATION_MS=0

# ============================================================================
# Power Management
# ============================================================================

# Idle sleep timeout (15 minutes = 900000ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Idle timeout before going to idle state (30 seconds)
CONFIG_ZMK_IDLE_TIMEOUT=30000

# ============================================================================
# Bluetooth Configuration
# ============================================================================

# Enable experimental Bluetooth settings
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Increase BLE transmit power for better range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Number of BLE profiles (max 5)
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# ============================================================================
# Keyboard Behavior
# ============================================================================

# Debounce settings (low latency)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# ============================================================================
# USB Configuration
# ============================================================================

# USB logging (disable for production, enable for debugging)
# CONFIG_ZMK_USB_LOGGING=y

# ============================================================================
# Split Keyboard Configuration
# ============================================================================

# Split keyboard settings are handled by shield definitions
# Central (master) side will connect to the computer
# Peripheral side connects to central via BLE

# ============================================================================
# ZMK Studio Configuration
# ============================================================================

# ZMK Studio is enabled via build.yaml cmake-args
# CONFIG_ZMK_STUDIO=y is set globally
# Studio RPC communication via USB/UART is enabled via snippet

# ============================================================================
# Advanced Features
# ============================================================================

# Mouse emulation support (if needed)
# CONFIG_ZMK_MOUSE=y

# ============================================================================
# Battery Reporting
# ============================================================================

# Enable battery monitoring
CONFIG_ZMK_BATTERY_REPORTING=y

# Battery report interval (in seconds)
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# ============================================================================
# External Power Control (for RGB, OLED power management)
# ============================================================================

# Enable external power control
CONFIG_ZMK_EXT_POWER=y

# ============================================================================
# RGB Configuration (Optional - if using RGB underglow)
# ============================================================================

# Note: RGB and nice!view ePaper displays typically share pins
# Cannot use both simultaneously on standard configurations

# Uncomment if using RGB underglow:
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
# CONFIG_ZMK_RGB_UNDERGLOW_HUE_STEP=10
# CONFIG_ZMK_RGB_UNDERGLOW_SAT_STEP=10
# CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=10
# CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

# ============================================================================
# Logging (Debugging Only)
# ============================================================================

# Uncomment for debugging:
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG=y
# CONFIG_ZMK_LOG_LEVEL_DBG=y
# CONFIG_SENSOR_LOG_LEVEL_DBG=y
