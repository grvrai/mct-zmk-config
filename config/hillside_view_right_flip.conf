# ========================================
# Hillside View RIGHT FLIP (peripheral)
# Features: Cirque trackpad, no display, MCU on top
# =========================================

CONFIG_ZMK_KEYBOARD_NAME="HSV Right"

# Bluetooth - max power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Battery reporting for central to display
CONFIG_ZMK_BATTERY_REPORTING=y

# Display - DISABLED on right side (Cirque trackpad instead)
CONFIG_ZMK_DISPLAY=n

# Encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Pointing device (Cirque trackpad) - mainline ZMK
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PINCTRL=y
