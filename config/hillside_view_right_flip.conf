# Hillside View Right Flip - Peripheral side (no display)
# Cirque trackpad on I2C, relays to central

# Disable display (not present on peripheral)
CONFIG_ZMK_DISPLAY=n

# Encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Bluetooth - max power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Mouse/Trackpad
CONFIG_ZMK_MOUSE=y
