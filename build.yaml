# ========================================
# Hillside View Cirque Branch
# Focused build configuration for Hillside View keyboard
# with Cirque trackpad support using mainline ZMK
# =========================================
---
include:
  ### HILLSIDE VIEW START ###
  # Hillside View 46-key split keyboard with nice!nano v2 + nice_view + Cirque trackpad
  # Uses mainline ZMK with native pointing support + ZMK Studio
  #
  # FLIPPED LAYOUT (MCU on top - solder sockets on opposite side of each PCB):
  # - Left (central): Display, receives Cirque via BLE split
  # - Right (peripheral): Cirque trackpad on I2C
  - board: nice_nano
    shield: hillside_view_left_flip nice_view
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    snippet: studio-rpc-usb-uart
    artifact-name: nice_hillside_view_left_flip
  - board: nice_nano
    shield: hillside_view_right_flip
    artifact-name: nice_hillside_view_right_flip
  ### HILLSIDE VIEW END ###

  ### SETTINGS_RESET START ###
  - board: nice_nano
    shield: settings_reset
    artifact-name: nice_settings_reset
  ### SETTINGS_RESET END ###
